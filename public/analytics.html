<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="brand/childplay-logo-icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .dash { max-width: 1100px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin: 14px 0; }
  .kpi { background: var(--paper); border-radius: 20px; box-shadow: var(--shadow); padding: 14px 16px; }
  .kpi b { display: block; font-family: var(--head); font-size: 30px; color: var(--teal-lo); }
  .kpi span { color: var(--muted); font-weight: 800; font-size: 13px; }
  .panel { background: var(--paper); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; margin: 14px 0; }
  .panel h2 { margin: 0 0 10px; font-size: 20px; }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 140px; }
  .bars div { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 1px; height: 100%; }
  .bars i { display: block; border-radius: 4px 4px 0 0; min-height: 2px; }
  .bars .p { background: var(--teal); } .bars .l { background: var(--coral); }
  .axis, .legend { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; font-weight: 800; margin-top: 6px; }
  .legend { justify-content: flex-start; gap: 14px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; }
  .tabs-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  td.num, th.num { text-align: right; }
  td.text { white-space: normal; min-width: 240px; }
  .guest { color: var(--muted); }
  .gate { text-align: center; max-width: 440px; margin: 12vh auto; }
</style>
<title>Analytics · Smart Worksheet</title>
</head>
<body>
<main class="dash" id="dash"><p class="loading"><img src="brand/childplay-logo-icon.svg" alt="" width="72" height="72"></p></main>
<script type="module" src="analytics.js"></script>
</body>
</html>
